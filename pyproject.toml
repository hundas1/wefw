[project]
name = "prop-firm-rapier"
version = "0.1.0"
description = "Prop Firm Rapier - multi-timeframe Bias + OTE trading bot for NQ futures"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rapier = "rapier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rapier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
